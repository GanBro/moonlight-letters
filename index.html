<!doctype html>
<html lang="zh-CN" data-page="release" data-template="2.0.0"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#161324">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>月光来信 · 双人相册</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292438;
      --muted: #645b70;
      --accent: #4e3d67;
      --accent-dark: #392b50;
      --paper: #fffdf8;
      --cream: #f7f2ec;
      --border: #ddd3db;
      --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--cream); }
    body:not(.reading) {
      background: radial-gradient(ellipse at 27% 25%, #362848 0%, #1d182e 55%, #151222 100%);
    }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2, h3 { line-height: 1.22; overflow-wrap: anywhere; }
    h1, h2 { font-family: var(--serif); }
    p { overflow-wrap: anywhere; }
    button, input, textarea, .button { font: inherit; }
    button, .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .66rem 1.05rem;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--accent);
      color: #fffdf8;
      text-align: center;
      text-decoration: none;
      font-weight: 650;
      line-height: 1.35;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover, .button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .65; cursor: wait; }
    .subtle {
      background: #f5eff5;
      border-color: var(--border);
      color: var(--accent-dark);
    }
    .subtle:hover { background: #eae0ed; }
    :focus-visible { outline: 3px solid #92749f; outline-offset: 3px; }
    label { display: block; font-weight: 650; }
    input:not([type="checkbox"]), textarea {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: .65rem .8rem;
      border: 1px solid #cfc2d0;
      border-radius: 9px;
      background: #fffdfb;
      color: var(--ink);
    }
    input::placeholder, textarea::placeholder { color: #766b7c; }
    textarea { resize: vertical; }
    .field { display: grid; gap: .34rem; min-width: 0; }
    .caption { color: var(--muted); font-size: .875rem; }
    .status { color: #4e4063; font-size: .9rem; }
    .status:empty { display: none; }
    .status[data-tone="error"] { color: #8b3141; }
    .front {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 5vw, 4.5rem);
    }
    .frame {
      width: min(100%, 68rem);
      display: grid;
      grid-template-columns: 1.06fr 1fr;
      overflow: hidden;
      border: 1px solid #ffffff30;
      border-radius: 26px;
      box-shadow: 0 24px 76px #0b071a70;
    }
    .cover {
      position: relative;
      isolation: isolate;
      min-height: 38rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
      overflow: hidden;
      padding: clamp(2rem, 5vw, 3.5rem);
      color: #fcf4e5;
      background:
        radial-gradient(circle at 87% 11%, #fbebc8 0 1px, transparent 2px),
        radial-gradient(circle at 67% 20%, #ab98c3 0 1px, transparent 2px),
        radial-gradient(circle at 20% 38%, #d6b7d3 0 1px, transparent 2px),
        radial-gradient(circle at 11% 66%, #f9e8c6 0 1px, transparent 2px),
        radial-gradient(circle at 79% 69%, #f9e8c6 0 1px, transparent 2px),
        radial-gradient(circle at 58% 84%, #cbb0cb 0 1px, transparent 2px),
        radial-gradient(circle at 31% 88%, #9b84ac 0 1px, transparent 2px),
        radial-gradient(ellipse at 56% 54%, #644868 0%, #362744 44%, #232039 82%);
    }
    .cover-heading { z-index: 1; }
    .cover h1 { margin-top: .6rem; font-size: clamp(2.3rem, 5.4vw, 4rem); letter-spacing: .08em; font-weight: 600; }
    .cover-type { color: #e9cbd8; font-size: .78rem; letter-spacing: .26em; display: inline-flex; align-items: center; gap: .75rem; }
    .cover-type::before { content: ""; width: 1.35rem; height: 1px; background: currentColor; }
    .cover-line { z-index: 1; color: #e8d5e7; font-size: .9rem; letter-spacing: .12em; }
    .sky { position: relative; min-height: 17rem; }
    .moon, .orbit, .star { position: absolute; }
    .moon, .orbit { top: 49%; left: 50%; }
    .moon {
      width: clamp(8rem, 17vw, 12rem);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 68% 66%, #c686a970 0%, transparent 37%),
        radial-gradient(ellipse at 39% 29%, #fff4d5 0%, transparent 37%),
        radial-gradient(circle at 36% 61%, #d3a2b564 0 11%, transparent 18%),
        radial-gradient(ellipse at 72% 32%, #d8acc080 0 13%, transparent 22%),
        radial-gradient(circle at 30% 20%, #fff0ce, #e7b8bc 60%, #966fa8 100%);
      box-shadow: 0 0 58px #efc5dc60, inset -10px -13px 32px #986d9e50;
    }
    .orbit {
      width: min(99%, 24rem);
      aspect-ratio: 2.3;
      transform: translate(-50%, -50%) rotate(-25deg);
      border: 1px solid #ecd0dc60;
      border-radius: 50%;
    }
    .orbit.alt { width: min(90%, 21rem); transform: translate(-50%, -50%) rotate(31deg); border-color: #ecd0dc32; }
    .star { color: #f3d9c8; font-size: 1.35rem; line-height: 1; }
    .star.one { top: 18%; left: 17%; }
    .star.two { bottom: 26%; right: 13%; font-size: .85rem; }
    .star.three { top: 22%; right: 15%; font-size: .65rem; }
    .paper { min-width: 0; display: grid; place-items: center; background: var(--paper); padding: clamp(1.5rem, 4.4vw, 3.5rem); }
    .panel { width: 100%; max-width: 31rem; }
    .gate-panel { max-width: 23rem; }
    .panel h2 { font-size: clamp(1.55rem, 3vw, 2.25rem); margin-bottom: .6rem; }
    .panel > .caption { margin-bottom: 1.25rem; }
    .form-stack { display: grid; gap: 1rem; }
    .panel .status { margin-top: .85rem; }
    .secret { position: relative; }
    .secret input { padding-right: 4.4rem; }
    .secret button {
      position: absolute;
      inset: 0 2px 0 auto;
      min-width: 3.6rem;
      padding: .35rem .55rem;
      background: transparent;
      color: var(--accent-dark);
      font-size: .84rem;
    }
    .secret button:hover { text-decoration: underline; }
    .local-note {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin-top: 1.45rem;
      padding-top: 1rem;
      border-top: 1px solid #ece3e8;
    }
    .seal-icon {
      flex: 0 0 auto;
      position: relative;
      width: 12px;
      height: 10px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      margin-top: 4px;
    }
    .seal-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      bottom: 7px;
      width: 5px;
      height: 6px;
      border: 1.5px solid currentColor;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
    }
    .accounts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
    .account { display: grid; gap: .65rem; min-width: 0; margin: 0; padding: .65rem .7rem .85rem; border: 1px solid var(--border); border-radius: 12px; }
    .account legend { padding: 0 .35rem; color: var(--accent-dark); font-weight: 700; }
    .account label { font-size: .875rem; }
    .account input { padding-inline: .55rem; }
    .checkbox { display: flex; align-items: center; gap: .55rem; min-height: 36px; color: var(--muted); font-weight: 500; }
    .checkbox input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
    .import { display: grid; gap: .5rem; margin-top: 1.35rem; padding-top: 1.1rem; border-top: 1px solid #ece3e8; }
    .import summary { min-height: 44px; padding: .6rem 0; color: var(--accent-dark); font-weight: 650; cursor: pointer; }
    .import .field { margin-top: .45rem; }
    input[type="file"] { font-size: .875rem; }
    input::file-selector-button {
      margin-right: .5rem;
      padding: .32rem .65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent-dark);
      background: #f7eff6;
      font: inherit;
      cursor: pointer;
    }
    .album-header { color: #fff6e9; background: #252037; }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(100% - 2.5rem, 65rem);
      min-height: 62px;
      margin: auto;
    }
    .brand { display: inline-flex; align-items: center; gap: .7rem; white-space: nowrap; font-family: var(--serif); font-size: 1.16rem; letter-spacing: .1em; }
    .brand::before { content: ""; width: 14px; height: 14px; border-radius: 50%; box-shadow: 3px 2px 0 #f7d7c3; transform: rotate(15deg); }
    .identity { min-width: 0; color: #ead5e6; font-size: .85rem; overflow-wrap: anywhere; text-align: right; }
    .album-inner { width: min(100% - 2.5rem, 65rem); margin-inline: auto; padding-bottom: 3rem; }
    .album-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: clamp(1.8rem, 5vw, 3.75rem) 0 1.3rem;
    }
    .album-intro h1 { font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: .045em; }
    .count { margin-top: .45rem; color: var(--muted); font-size: .9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .55rem; }
    .save-state {
      padding: .8rem 1rem;
      border: 1px solid #e2d8e3;
      border-radius: 11px;
      background: #faf6fa;
      font-size: .875rem;
      color: var(--accent-dark);
    }
    .save-state[data-dirty="true"] { background: #fcf1e7; border-color: #e6cbba; color: #673f34; }
    .album-status { margin-top: .65rem; }
    .editor, .download, .empty, .memory {
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--paper);
      border-radius: 16px;
    }
    .editor, .download { margin-top: 1rem; padding: clamp(1rem, 3vw, 1.6rem); }
    .editor h2 { margin-bottom: 1rem; font-size: 1.5rem; }
    .edit-pair { display: grid; grid-template-columns: minmax(8.8rem, 11rem) minmax(0, 1fr); gap: .85rem; }
    .editor .actions, .download .actions { align-items: center; }
    .preview { display: grid; justify-items: start; gap: .6rem; }
    .preview img { display: block; max-width: 100%; max-height: 13rem; border-radius: 8px; }
    .entries { display: grid; gap: 1rem; margin-top: 1.1rem; }
    .empty { display: grid; justify-items: start; gap: .7rem; padding: clamp(1.25rem, 4vw, 2.6rem); }
    .empty h2 { font-size: 1.45rem; }
    .memory { padding: clamp(1.15rem, 3.5vw, 2rem); }
    .memory:has(figure) { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; gap: 1.25rem; }
    .memory time { color: #725679; font-size: .86rem; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
    .memory h2 { margin: .45rem 0 .65rem; font-size: clamp(1.3rem, 3vw, 1.95rem); }
    .memory p { white-space: pre-wrap; color: #524861; }
    .memory img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 37rem;
      border-radius: 9px;
      margin-inline: auto;
    }
    .download .caption { margin-bottom: .7rem; }
    @media (max-width: 760px) {
      .front { padding: 1rem; }
      .frame { grid-template-columns: minmax(0, 1fr); width: min(100%, 34rem); border-radius: 18px; }
      .cover { min-height: 12rem; padding: 1.45rem; }
      .cover h1 { font-size: clamp(2rem, 7vw, 3rem); }
      .cover-line { align-self: end; font-size: .77rem; }
      .sky { position: absolute; inset: 0 2% 0 54%; min-height: 0; }
      .moon { width: clamp(4rem, 17vw, 6.5rem); }
      .star.one { left: 12%; font-size: .8rem; }
      .star.two { right: 13%; }
      .star.three { right: 18%; top: 20%; }
      .paper { padding: 1.45rem; }
      .gate-panel { max-width: none; }
      .memory:has(figure) { grid-template-columns: minmax(0, 1fr); }
      .masthead, .album-inner { width: calc(100% - 2rem); }
    }
    @media (max-width: 460px) {
      .accounts, .edit-pair { grid-template-columns: minmax(0, 1fr); }
      .album-intro .actions { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .album-intro .actions button:first-child { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      button, .button { transition: background-color .16s ease; }
    }
  </style>
</head>
<body>
  <main>
    <div class="front" id="front">
      <div class="frame">
        <header class="cover">
          <div class="cover-heading">
            <span class="cover-type">双人相册</span>
            <h1>月光来信</h1>
          </div>
          <div class="sky" aria-hidden="true">
            <div class="orbit alt"></div>
            <div class="moon"></div>
            <div class="orbit"></div>
            <span class="star one">✦</span>
            <span class="star two">✧</span>
            <span class="star three">✦</span>
          </div>
          <p class="cover-line">两个人的照片与日记</p>
        </header>
        <div class="paper">
          <section class="panel gate-panel" id="startup">
            <h2 tabindex="-1">准备打开相册</h2>
            <p id="startup-message" role="status">如果页面停在这里，请用新版 Edge、Chrome 或 Safari 打开完整的 HTML 文件，也可以试试上一次保存的加密副本。</p>
          </section>
          
          <section class="panel gate-panel" id="gate" hidden="">
            <h2 tabindex="-1">打开我们的相册</h2>
            <p class="caption">输入你的专属账号，读我们一起写下的回忆。</p>
            <form class="form-stack" id="login" method="post" novalidate="">
              <div class="field">
                <label for="user">用户名</label>
                <input id="user" name="user" placeholder="输入你的用户名" autocomplete="username" autocapitalize="none" spellcheck="false" required="">
              </div>
              <div class="field">
                <label for="pass">密码</label>
                <div class="secret">
                  <input id="pass" name="pass" type="password" placeholder="输入密码" autocomplete="current-password" required="">
                  <button id="reveal-login" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
                </div>
              </div>
              <button id="login-button" type="submit"><span data-label="">打开相册</span><span aria-hidden="true">→</span></button>
            </form>
            <p class="status" id="gate-status" role="status"></p>
            <p class="caption local-note"><span class="seal-icon" aria-hidden="true"></span>图文仅在当前设备解锁</p>
          </section>
        </div>
      </div>
    </div>
    <section id="album" aria-labelledby="album-title" hidden="">
      <header class="album-header">
        <div class="masthead"><span class="brand">月光来信</span><span class="identity" id="identity"></span></div>
      </header>
      <div class="album-inner">
        <div class="album-intro">
          <div><h1 id="album-title" tabindex="-1">我们的回忆</h1><p class="count" id="count"></p></div>
          <div class="actions">
            <button type="button" id="write" aria-controls="editor" aria-expanded="false">写一段回忆</button>
            <button type="button" class="subtle" id="save">下载加密网站</button>
            <button type="button" class="subtle" id="lock">锁上相册</button>
          </div>
        </div>
        <p class="save-state" id="save-state"></p>
        <p class="status album-status" id="album-status" role="status"></p>
        <div class="download" id="download" hidden="">
          <p class="caption" id="download-help">从下载目录打开新文件，登录并核对内容，再回来标记已核对。将这份文件提交到 GitHub 后，原网址才会更新。</p>
          <div class="actions">
            <a class="button subtle" id="download-again" download="index.html">再次保存 index.html</a>
            <button type="button" class="subtle" id="confirm-download" aria-describedby="download-help">我已打开并核对</button>
          </div>
        </div>
        <section class="editor" id="editor" aria-labelledby="editor-title" hidden="">
          <h2 id="editor-title">写一段回忆</h2>
          <form class="form-stack" id="add" method="post" novalidate="">
            <div class="edit-pair">
              <div class="field"><label for="date">日期</label><input id="date" name="date" type="date" min="0001-01-01" max="9999-12-31" required=""></div>
              <div class="field"><label for="title">标题</label><input id="title" name="title" maxlength="100" required=""></div>
            </div>
            <div class="field"><label for="note">想记住的话</label><textarea id="note" name="note" rows="4"></textarea></div>
            <div class="field">
              <label for="photo">照片（可选）</label>
              <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" aria-describedby="photo-help">
              <p class="caption" id="photo-help">一张 JPG、PNG 或 WebP，最大 3 MiB。</p>
              <p class="status" id="photo-status" role="status"></p>
            </div>
            <div class="preview" id="preview" hidden=""><img id="preview-image" alt="所选照片预览"></div>
            <div class="actions">
              <button type="submit" id="add-button">加入相册</button>
              <button type="button" class="subtle" id="remove-photo" hidden="">移除所选照片</button>
            </div>
            <p class="status" id="editor-status" role="status"></p>
          </form>
        </section>
        <div class="entries" id="entries"></div>
      </div>
    </section>
  </main>
  <script>
  'use strict';

  const $ = id => document.getElementById(id);
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', { fatal: true });
  const MiB = 1024 * 1024;
  const MAX_PHOTO = 3 * MiB;
  const MAX_CONTENT = 16 * MiB;
  const MAX_HTML = 25 * MiB;
  const TAG_BYTES = 16;
  const pageType = document.documentElement.dataset.page;
  const panes = ['startup', 'setup', 'gate', 'album'];
  const buttonLabels = new Map([
    ['create-button', ['建立双人相册', '正在建立…']],
    ['login-button', ['打开相册', '正在解锁…']],
    ['add-button', ['加入相册', '正在加入…']],
    ['save', ['下载加密网站', '正在生成…']]
  ]);
  let pristine;
  let vault = null;
  let session = null;
  let operation = null;
  let preview = null;
  let download = null;
  let upgrading = false;
  let verifiedDownload = false;
  let defaultDate = '';

  class AlbumError extends Error {}

  function fail(message) {
    throw new AlbumError(message);
  }

  function bytesTo64(source) {
    const bytes = new Uint8Array(source);
    let binary = '';
    for (let offset = 0; offset < bytes.length; offset += 8192) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + 8192));
    }
    return btoa(binary);
  }

  function bytesFrom64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < bytes.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function base64Size(value) {
    if (typeof value !== 'string' || !value || value.length % 4 || /[^a-zA-Z0-9+/=]/.test(value)) return -1;
    const padding = value.endsWith('==') ? 2 : value.endsWith('=') ? 1 : 0;
    if (value.indexOf('=') !== (padding ? value.length - padding : -1)) return -1;
    return value.length * 3 / 4 - padding;
  }

  function randomBytes(length) {
    return crypto.getRandomValues(new Uint8Array(length));
  }

  async function passwordKey(password, salt) {
    const base = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  function albumKey(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  async function seal(key, bytes) {
    const iv = randomBytes(12);
    const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes);
    return { iv: bytesTo64(iv), data: bytesTo64(ciphertext) };
  }

  function openBox(key, box) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytesFrom64(box.iv) }, key, bytesFrom64(box.data));
  }

  function normalizedName(value) {
    return value.trim().normalize('NFC');
  }

  function isRecord(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function checkedBox(box, min, max) {
    const length = base64Size(box?.data);
    if (!isRecord(box) || base64Size(box.iv) !== 12 || length < min || length > max) {
      fail('相册的加密数据缺失或损坏。请保留原文件，并打开一份可读的备份。');
    }
    return { iv: box.iv, data: box.data };
  }

  function readVault(source) {
    let value;
    try {
      value = JSON.parse(source);
    } catch {
      fail('未能读取相册数据。下载的文件可能不完整，请保留原文件并尝试一份备份。');
    }
    if (isRecord(value) && Object.hasOwn(value, 'version')) {
      fail('此文件使用了不同的相册格式。请保留原文件，用与它对应的制作页打开。');
    }
    if (!isRecord(value) || !Array.isArray(value.slots) || value.slots.length !== 2) {
      fail('文件里没有完整的双人相册。请保留原文件，并确认选中了之前下载的加密成品。');
    }
    // Copy only fields understood by the current template.
    const slots = value.slots.map(slot => {
      if (!isRecord(slot) || typeof slot.user !== 'string' || !slot.user ||
          normalizedName(slot.user) !== slot.user || base64Size(slot.salt) !== 16) {
        fail('文件里的账号数据不完整。请保留原文件，并打开一份可读的备份。');
      }
      return { user: slot.user, salt: slot.salt, box: checkedBox(slot.box, 32 + TAG_BYTES, 32 + TAG_BYTES) };
    });
    if (slots[0].user === slots[1].user) fail('文件里出现了重复的账号。请打开一份可读的备份。');
    return { slots, content: checkedBox(value.content, 2 + TAG_BYTES, MAX_CONTENT + TAG_BYTES) };
  }

  function localDate() {
    const date = new Date();
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0')
    ].join('-');
  }

  function validDate(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value) || value.startsWith('0000')) return false;
    const date = new Date(value + 'T00:00:00Z');
    return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
  }

  function validPhotoURL(value) {
    if (value === '') return true;
    if (typeof value !== 'string') return false;
    const prefix = /^data:image\/(?:jpeg|png|webp);base64,/.exec(value);
    if (!prefix) return false;
    const size = base64Size(value.slice(prefix[0].length));
    return size > 0 && size <= MAX_PHOTO;
  }

  function readMemories(bytes) {
    if (bytes.byteLength > MAX_CONTENT) fail('相册超过可读取的容量。');
    const value = JSON.parse(decoder.decode(bytes));
    if (!Array.isArray(value) || value.some(memory =>
      !isRecord(memory) || !validDate(memory.date) ||
      typeof memory.title !== 'string' || !memory.title || memory.title.length > 100 ||
      typeof memory.note !== 'string' || !validPhotoURL(memory.photo)
    )) fail('部分回忆的格式无法读取。');
    return value.map(({ date, title, note, photo }) => ({ date, title, note, photo }));
  }

  function status(id, message = '', tone = '') {
    const target = $(id);
    if (!target) return;
    target.dataset.tone = tone;
    target.textContent = message;
  }

  function show(id, focus = true) {
    for (const pane of panes) {
      if ($(pane)) $(pane).hidden = pane !== id;
    }
    $('front').hidden = id === 'album';
    document.body.classList.toggle('reading', id === 'album');
    if (focus) {
      window.scrollTo(0, 0);
      $(id).querySelector('h1, h2')?.focus({ preventScroll: true });
    }
  }

  function finishOperation(token) {
    if (operation !== token) return;
    operation = null;
    for (const control of token.controls) control.disabled = false;
    if (token.button) setButtonLabel(token.button, false);
  }

  function setButtonLabel(button, pending) {
    const label = button.querySelector('[data-label]') || button;
    label.textContent = buttonLabels.get(button.id)[Number(pending)];
  }

  async function run(pane, statusId, progress, button, action) {
    if (operation) return;
    const controls = [...$(pane).querySelectorAll('button, input, textarea')].filter(control => !control.disabled);
    const token = { controls, button };
    operation = token;
    for (const control of controls) control.disabled = true;
    if (button) setButtonLabel(button, true);
    status(statusId, progress);
    try {
      await action(token);
      if (operation === token && $(statusId).textContent === progress) status(statusId);
    } catch (error) {
      if (operation === token) {
        status(statusId, error instanceof AlbumError ? error.message : '操作未完成，请重试。', 'error');
      }
    } finally {
      finishOperation(token);
    }
  }

  function formAction(formId, pane, statusId, progress, buttonId, action) {
    $(formId)?.addEventListener('submit', event => {
      event.preventDefault();
      if (operation || $(pane).hidden) return;
      const fields = new FormData(event.currentTarget);
      run(pane, statusId, progress, $(buttonId), token => action(fields, token));
    });
  }

  function draftExists() {
    return !!($('title').value || $('note').value || $('photo').files.length || $('date').value !== defaultDate);
  }

  function shouldWarn() {
    return !!session && (session.dirty || draftExists());
  }

  function warnBeforeLeaving(event) {
    if (!shouldWarn()) return;
    event.preventDefault();
    event.returnValue = '';
  }

  function updateState() {
    const pending = shouldWarn();
    const draft = !!session && draftExists();
    const saveState = $('save-state');
    saveState.dataset.dirty = String(pending);
    if (draft) {
      saveState.textContent = '这段草稿还没加入相册。加入后，请下载新版并打开核对。';
    } else if (session?.dirty && download) {
      saveState.textContent = '已生成加密文件。请在下载目录打开核对，再回来确认。';
    } else if (session?.dirty) {
      saveState.textContent = '有更改待保存。请下载加密网站，再打开新文件核对。';
    } else if (verifiedDownload) {
      saveState.textContent = '已标记核对。上传核对过的 index.html 后，原网址才会更新。';
    } else {
      saveState.textContent = '想更新相册？加入回忆并下载新文件，再用它更新 GitHub。';
    }
    if (pending) window.addEventListener('beforeunload', warnBeforeLeaving);
    else window.removeEventListener('beforeunload', warnBeforeLeaving);
  }

  function clearPhoto() {
    $('preview-image').removeAttribute('src');
    $('preview').hidden = true;
    if (preview) URL.revokeObjectURL(preview.url);
    preview = null;
  }

  function clearDownload() {
    $('download').hidden = true;
    $('download-again').removeAttribute('href');
    if (download) URL.revokeObjectURL(download.url);
    download = null;
  }

  function resetEditor() {
    $('add').reset();
    defaultDate = localDate();
    $('date').value = defaultDate;
    $('remove-photo').hidden = true;
    status('photo-status');
    status('editor-status');
    clearPhoto();
  }

  function toggleEditor(open, focus = true) {
    $('editor').hidden = !open;
    $('write').setAttribute('aria-expanded', String(open));
    $('write').textContent = open ? '收起编辑' : '写一段回忆';
    if (open && focus) {
      $('title').focus({ preventScroll: true });
      $('editor').scrollIntoView({ block: 'nearest' });
    }
  }

  function element(tag, value) {
    const node = document.createElement(tag);
    node.textContent = value;
    return node;
  }

  function memoryCard(memory) {
    const card = document.createElement('article');
    card.className = 'memory';
    const text = document.createElement('div');
    const date = element('time', memory.date);
    date.dateTime = memory.date;
    text.append(date, element('h2', memory.title));
    if (memory.note) text.append(element('p', memory.note));
    card.append(text);
    if (memory.photo) {
      const figure = document.createElement('figure');
      const photo = new Image();
      photo.alt = '回忆照片：' + memory.title;
      photo.loading = 'lazy';
      photo.decoding = 'async';
      photo.addEventListener('error', () => {
        if (figure.isConnected) figure.replaceChildren(element('figcaption', '这张照片暂时无法显示。'));
      }, { once: true });
      photo.src = memory.photo;
      figure.append(photo);
      card.append(figure);
    }
    return card;
  }

  function renderMemories() {
    const ordered = [...session.memories].reverse().sort((a, b) => b.date.localeCompare(a.date));
    $('count').textContent = ordered.length + ' 段回忆';
    if (ordered.length) {
      const cards = document.createDocumentFragment();
      for (const memory of ordered) cards.append(memoryCard(memory));
      $('entries').replaceChildren(cards);
      return;
    }
    const empty = document.createElement('div');
    empty.className = 'empty';
    const first = element('button', '写第一段回忆');
    first.type = 'button';
    first.addEventListener('click', () => toggleEditor(true));
    const hint = element('p', '记下一件想和对方一起留住的小事。');
    hint.className = 'caption';
    empty.append(element('h2', '第一段回忆，从这里开始'), hint, first);
    $('entries').replaceChildren(empty);
  }

  function revealLogin(showPassword) {
    $('pass').type = showPassword ? 'text' : 'password';
    $('reveal-login').textContent = showPassword ? '隐藏' : '显示';
    $('reveal-login').setAttribute('aria-pressed', String(showPassword));
    $('reveal-login').setAttribute('aria-label', showPassword ? '隐藏密码' : '显示密码');
  }

  function revealSetup(showPassword) {
    for (const id of ['p1', 'p2', 'c1', 'c2']) $(id).type = showPassword ? 'text' : 'password';
  }

  function startSession(key, memories, username, dirty) {
    session = { key, memories, dirty };
    verifiedDownload = false;
    $('identity').textContent = username ? '已解锁 · ' + username : '本地制作';
    $('login').reset();
    revealLogin(false);
    status('gate-status');
    status('album-status');
    resetEditor();
    toggleEditor(false);
    renderMemories();
    updateState();
    show('album');
  }

  function closeSession(focus = true) {
    if (operation) finishOperation(operation);
    session = null;
    verifiedDownload = false;
    clearDownload();
    resetEditor();
    toggleEditor(false);
    $('entries').replaceChildren();
    $('count').textContent = '';
    $('identity').textContent = '';
    $('login').reset();
    revealLogin(false);
    status('album-status');
    status('gate-status');
    if ($('create')) {
      $('create').reset();
      revealSetup(false);
      $('import-file').value = '';
    }
    updateState();
    if (vault) show('gate', focus);
    else if (pageType === 'maker' && !$('setup').hidden) show('setup', focus);
  }

  async function createAlbum(fields, token) {
    const names = ['u1', 'u2'].map(id => normalizedName(fields.get(id)));
    const passwords = ['p1', 'p2'].map(id => fields.get(id));
    if (names.some(name => !name || name.length > 48)) fail('请给两个账号各输入 1 至 48 个字符的用户名。');
    if (names[0] === names[1]) fail('请为两个人设置不同的用户名。');
    if (passwords.some(password => [...password].length < 16)) fail('每组密码请至少输入 16 个字符。');
    if (passwords[0] === passwords[1]) fail('请为两个账号设置不同的密码。');
    if (passwords[0] !== fields.get('c1') || passwords[1] !== fields.get('c2')) {
      fail('确认密码与第一次输入不一致，请检查两组密码。');
    }

    const raw = randomBytes(32);
    try {
      const slots = [];
      for (let index = 0; index < 2; index++) {
        const salt = randomBytes(16);
        const key = await passwordKey(passwords[index], salt);
        slots.push({ user: names[index], salt: bytesTo64(salt), box: await seal(key, raw) });
      }
      const key = await albumKey(raw);
      const content = await seal(key, encoder.encode('[]'));
      if (operation !== token) return;
      vault = { slots, content };
      $('create').reset();
      revealSetup(false);
      startSession(key, [], '', true);
    } finally {
      raw.fill(0);
    }
  }

  async function unlock(fields, token) {
    const username = normalizedName(fields.get('user'));
    const password = fields.get('pass');
    if (!username || !password) fail('请输入用户名和密码。');
    const slot = vault.slots.find(candidate => candidate.user === username);
    let key;
    try {
      if (!slot) throw new Error();
      const derived = await passwordKey(password, bytesFrom64(slot.salt));
      const raw = new Uint8Array(await openBox(derived, slot.box));
      try {
        key = await albumKey(raw);
      } finally {
        raw.fill(0);
      }
    } catch {
      if (operation === token) {
        $('pass').value = '';
        revealLogin(false);
      }
      fail('用户名或密码不正确，或该账号的加密数据已损坏。请检查后重试。');
    }
    let memories;
    try {
      memories = readMemories(await openBox(key, vault.content));
    } catch {
      if (operation === token) {
        $('pass').value = '';
        revealLogin(false);
      }
      fail('密码已验证，但相册内容无法读取。请保留此文件，并打开上一次可读的备份。');
    }
    if (operation === token) startSession(key, memories, slot.user, upgrading);
  }

  async function importAlbum(file, token) {
    if (file.size > MAX_HTML) fail('文件超过 25 MiB，请确认选中了之前下载的加密相册。');
    const source = await file.text();
    if (!/<\/html\s*>\s*$/i.test(source)) fail('这个 HTML 文件可能没有完整下载。请保留原文件，并尝试另一份备份。');
    // A template document keeps the uploaded page inert. Never attach its markup to this page.
    const inertPage = document.createElement('template');
    inertPage.innerHTML = source;
    const blocks = inertPage.content.querySelectorAll('[id="vault"]');
    if (blocks.length !== 1 || !blocks[0].matches('script[type="application/json"]')) {
      fail('没有找到唯一的加密相册，请选择之前下载的 HTML 成品。');
    }
    const candidate = readVault(blocks[0].textContent);
    if (operation !== token) return;
    vault = candidate;
    upgrading = true;
    $('create').reset();
    revealSetup(false);
    $('import-details').open = false;
    show('gate');
    status('gate-status', '文件已读入。请用原来的账号解锁，核对回忆后下载新版。');
  }

  function photoFormat(bytes) {
    if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'image/jpeg';
    const pngSignature = [137, 80, 78, 71, 13, 10, 26, 10];
    if (pngSignature.every((byte, index) => bytes[index] === byte)) return 'image/png';
    if (String.fromCharCode(...bytes.subarray(0, 4)) === 'RIFF' &&
        String.fromCharCode(...bytes.subarray(8, 12)) === 'WEBP') return 'image/webp';
    return '';
  }

  async function loadPhoto(file, token) {
    if (!file.size) fail('选中的照片是空文件，请重新选择。');
    if (file.size > MAX_PHOTO) fail('这张照片超过 3 MiB，请压缩后重选。');
    const bytes = new Uint8Array(await file.arrayBuffer());
    const mime = photoFormat(bytes);
    if (!mime) fail('无法识别照片格式，请换用 JPG、PNG 或 WebP。');
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    const image = new Image();
    image.src = url;
    try {
      await image.decode();
    } catch {
      URL.revokeObjectURL(url);
      fail('浏览器无法打开这张照片，文件可能损坏。请换一张。');
    }
    if (operation !== token) {
      URL.revokeObjectURL(url);
      return null;
    }
    preview = { file, bytes, mime, url };
    $('preview-image').src = url;
    $('preview').hidden = false;
    return preview;
  }

  function serializedMemories(values) {
    const bytes = encoder.encode(JSON.stringify(values));
    if (bytes.byteLength > MAX_CONTENT) fail('这本相册已接近容量上限。请缩小这张照片，或另外建一本。');
    return bytes;
  }

  async function addMemory(fields, token) {
    const date = fields.get('date');
    const title = fields.get('title').trim();
    if (!validDate(date)) fail('请选择有效的日期。');
    if (!title || title.length > 100) fail('请输入 1 至 100 个字符的标题。');
    const file = $('photo').files[0];
    let photo = '';
    if (file) {
      const selected = preview?.file === file ? preview : await loadPhoto(file, token);
      if (!selected) return;
      photo = 'data:' + selected.mime + ';base64,' + bytesTo64(selected.bytes);
    }
    if (operation !== token) return;
    const memory = { date, title, note: fields.get('note'), photo };
    serializedMemories([...session.memories, memory]);
    session.memories.push(memory);
    session.dirty = true;
    verifiedDownload = false;
    clearDownload();
    resetEditor();
    toggleEditor(false);
    renderMemories();
    updateState();
    status('album-status', '已加入本次编辑。请下载新版，打开检查后再发布。');
    $('album-title').focus({ preventScroll: true });
  }

  async function exportAlbum(token) {
    if (draftExists()) fail('请先加入正在编辑的回忆，或清空草稿，再下载相册。');
    const bytes = serializedMemories(session.memories);
    const key = session.key;
    const content = await seal(key, bytes);
    const checked = await openBox(key, content);
    if (checked.byteLength !== bytes.byteLength) fail('读取生成的加密副本失败，请重试下载。');
    if (operation !== token) return;
    const page = pristine.cloneNode(true);
    page.dataset.page = 'release';
    page.querySelector('#setup')?.remove();
    page.querySelector('#vault').textContent = JSON.stringify({ slots: vault.slots, content }).replaceAll('<', '\\u003c');
    const html = new Blob(['<!doctype html>\n', page.outerHTML], { type: 'text/html;charset=utf-8' });
    if (html.size > MAX_HTML) fail('生成的网页超过 GitHub 网页上传的 25 MiB 上限。请压缩照片或另建一本。');
    const url = URL.createObjectURL(html);
    clearDownload();
    download = { content, url };
    $('download-again').href = url;
    $('download').hidden = false;
    updateState();
    status('album-status', '已生成 index.html。如果没有看到下载，可点「再次保存 index.html」。');
    $('download-again').click();
  }

  function bind() {
    formAction('create', 'setup', 'setup-status', '正在生成两组加密钥匙…', 'create-button', createAlbum);
    formAction('login', 'gate', 'gate-status', '正在验证密码，请稍等…', 'login-button', unlock);
    formAction('add', 'album', 'editor-status', '正在检查并加入回忆…', 'add-button', addMemory);
    $('reveal-setup')?.addEventListener('change', event => revealSetup(event.currentTarget.checked));
    $('reveal-login').addEventListener('click', () => revealLogin($('pass').type === 'password'));
    $('import-file')?.addEventListener('change', event => {
      const input = event.currentTarget;
      const file = input.files[0];
      input.value = '';
      if (file) run('setup', 'setup-status', '正在检查加密文件…', null, token => importAlbum(file, token));
    });
    $('write').addEventListener('click', () => toggleEditor($('editor').hidden));
    $('add').addEventListener('input', updateState);
    $('photo').addEventListener('change', event => {
      const file = event.currentTarget.files[0];
      clearPhoto();
      status('photo-status');
      $('remove-photo').hidden = !file;
      updateState();
      if (file) run('album', 'photo-status', '正在检查照片…', null, token => loadPhoto(file, token));
    });
    $('remove-photo').addEventListener('click', () => {
      $('photo').value = '';
      $('remove-photo').hidden = true;
      clearPhoto();
      status('photo-status');
      updateState();
    });
    $('save').addEventListener('click', () =>
      run('album', 'album-status', '正在加密并检查新文件…', $('save'), exportAlbum)
    );
    $('confirm-download').addEventListener('click', () => {
      if (!download || operation) return;
      vault = { slots: vault.slots, content: download.content };
      session.dirty = false;
      verifiedDownload = true;
      upgrading = false;
      updateState();
      status('album-status', '已标记这份下载文件为核对通过。可将它上传到发布仓库。');
      $('save').focus();
      clearDownload();
    });
    $('lock').addEventListener('click', () => {
      if (shouldWarn() && !window.confirm('有草稿或尚未核对下载的更改。确定放弃这些更改并锁上相册？')) return;
      closeSession();
    });
    window.addEventListener('pagehide', () => closeSession(false));
  }

  document.addEventListener('DOMContentLoaded', () => {
    try {
      if (!globalThis.crypto?.subtle) fail('此浏览器无法在这里解密。请用新版 Edge、Chrome 或 Safari 打开本地 HTML 文件或 HTTPS 网址。');
      if (!$('page-end') || !$('vault')) fail('加密相册文件不完整。请保留原文件，并打开一份可读的备份。');
      const embedded = $('vault').textContent;
      if (pageType === 'maker' && $('setup') && embedded.trim() === 'null') {
        pristine = document.documentElement.cloneNode(true);
        bind();
        show('setup', false);
        return;
      }
      if (pageType !== 'release' || $('setup')) fail('这个文件的页面结构不完整。请打开制作页或一份可读的发布文件。');
      vault = readVault(embedded);
      pristine = document.documentElement.cloneNode(true);
      bind();
      show('gate', false);
    } catch (error) {
      $('startup').querySelector('h2').textContent = '暂时无法打开相册';
      $('startup-message').textContent = error instanceof AlbumError
        ? error.message
        : '读取网页时出现错误。请保留原文件，并试试上次可读取的副本。';
    }
